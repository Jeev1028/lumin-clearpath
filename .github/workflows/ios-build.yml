name: Build iOS app (unsigned)

# Builds an *unsigned* ClearPath.ipa on GitHub's macOS runner (Xcode only
# runs on macOS, which isn't available in local dev here). Unsigned on
# purpose: with a free Apple Developer account there's no ad-hoc
# distribution certificate available, so instead of baking Apple
# credentials into CI secrets, this ships an unsigned IPA that you sign
# yourself at install time with a tool like Sideloadly or AltStore, using
# your own free Apple ID directly on your own machine. Nothing
# Apple-account-specific ever touches this repo or this workflow.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor project dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Register local (non-npm) native plugins
        # `cap sync` regenerates App/App/capacitor.config.json's
        # packageClassList by scanning node_modules for npm-distributed
        # Capacitor plugins ONLY (see @capacitor/cli's
        # util/iosplugin.js:getPluginFiles, which iterates the resolved npm
        # plugin list, never app source files) -- so it always overwrites
        # out any local, non-npm plugin class dropped directly into the App
        # target (e.g. NativeAuthPlugin.swift). Capacitor's iOS bridge only
        # ever registers classes present in that list (CapacitorBridge.swift
        # registerPlugins() reads it via NSClassFromString -- there's no
        # ObjC-runtime scanning fallback in current Capacitor versions), so
        # without this step every local plugin silently fails at runtime
        # with a generic "plugin is not implemented" error, no matter how
        # correctly it's compiled, signed, or installed. Re-add any local
        # plugin class names here after sync, every build.
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "ios/App/App/capacitor.config.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            const localPlugins = ["NativeAuthPlugin"];
            const list = new Set(config.packageClassList || []);
            for (const name of localPlugins) list.add(name);
            config.packageClassList = Array.from(list);
            fs.writeFileSync(path, JSON.stringify(config, null, "\t") + "\n");
          '
          cat ios/App/App/capacitor.config.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package as .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ClearPath-unsigned.ipa Payload
          ls -la ClearPath-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClearPath-unsigned-ipa
          path: ios/ClearPath-unsigned.ipa
          retention-days: 30
