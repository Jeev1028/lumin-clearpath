name: Lumin UNI auto-check
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC, once a week
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONIOENCODING=utf-8 python3 tools/uni-autofetch/verify/autofetch.py
      - run: head -20 tools/uni-autofetch/verify/autofetch_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: uni-autofetch-report
          path: tools/uni-autofetch/verify/autofetch_report.*
