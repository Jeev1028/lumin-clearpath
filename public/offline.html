<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — ClearPath</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0A1128;
        color: #E6EDF7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #94a3b8; max-width: 22rem; margin: 0 0 20px; }
      button {
        background: linear-gradient(135deg, #38BDF8, #2563EB);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>ClearPath needs a connection to load new data. Anything you already had open may still be cached — try again once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
